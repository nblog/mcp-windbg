[project]
name = "mcp-server-windbg"
version = "0.1.0"
description = "A Model Context Protocol server providing tools to analyze Windows crash dumps using WinDBG/CDB, built with Semantic Kernel"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["windbg", "cdb", "mcp", "llm", "crash-analysis"]
license = { text = "MIT" }
dependencies = [
    "semantic-kernel[mcp]",
    "pydantic[dotenv]>=2.0.0",
]

[project.scripts]
mcp-server-windbg = "mcp_server_windbg:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["src/mcp_server_windbg/tests"]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]
