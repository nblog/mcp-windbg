[project]
name = "mcp-server-windbg"
version = "0.1.0"
description = "A Model Context Protocol server providing tools to analyze Windows crash dumps using WinDBG/CDB, built with Semantic Kernel"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["windbg", "cdb", "mcp", "llm", "crash-analysis"]
license = { text = "MIT" }
dependencies = [
    "semantic-kernel[mcp]>=1.44.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-server-windbg = "mcp_server_windbg:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:mcp_server_windbg.*",
]
markers = [
    "requires_cdb: test needs a real cdb.exe and a crash dump present on the machine",
]
